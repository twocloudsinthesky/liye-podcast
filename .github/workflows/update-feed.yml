name: Update Liye podcast feed

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh feed from Xiaoyuzhou
        run: python3 update_feed.py --output feed.xml
      - name: Commit new episodes
        run: |
          date -u +%Y-%m > last-checked.txt
          git add feed.xml last-checked.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Liye podcast feed"
            git push
          fi
